worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        access_log off;
        server_tokens off;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header Cache-Control "no-cache" always;

        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location = / { try_files /index.html =404; }
        location = /site.css { try_files $uri =404; }
        location = /favicon.svg { try_files $uri =404; }
        location = /downloads/SHA256SUMS.txt { try_files $uri =404; }
        location = /downloads/release.json { try_files $uri =404; }
        location ~ ^/downloads/cat-meme-studio-[0-9]+\.[0-9]+\.[0-9]+-windows-x64\.exe$ {
            default_type application/octet-stream;
            add_header Content-Disposition attachment;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}

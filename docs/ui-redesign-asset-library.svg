  <rect x="1152" y="134" width="290" height="708" rx="12" class="panel"/>
  <text x="1180" y="174" class="h2">素材详情</text>
  <rect x="1180" y="204" width="234" height="150" rx="12" fill="url(#checker2)" stroke="#d7e0ed"/>
  <ellipse cx="1297" cy="278" rx="58" ry="44" fill="#d1a17c"/>

    <text y="292" class="small">收藏 12</text>
    <text y="326" class="small">最近使用 24</text>
  </g>

  <rect x="292" y="134" width="836" height="708" rx="12" class="panel"/>
  <rect x="322" y="164" width="520" height="44" rx="9" fill="#fff" stroke="#ccd8e7"/>

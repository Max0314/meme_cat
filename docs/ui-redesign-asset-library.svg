      <text x="210" y="174" class="small">视频 · 30s</text>
      <rect x="388" width="180" height="192" rx="12" class="subpanel"/>
      <rect x="402" y="14" width="152" height="106" rx="10" fill="url(#checker2)"/>
      <ellipse cx="478" cy="68" rx="38" ry="46" fill="#776455"/>

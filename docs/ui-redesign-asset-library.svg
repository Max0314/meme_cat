      .h3{font:700 16px "Microsoft YaHei",Arial,sans-serif;fill:#1f2f46}
      .txt{font:400 15px "Microsoft YaHei",Arial,sans-serif;fill:#66758c}
      .small{font:400 13px "Microsoft YaHei",Arial,sans-serif;fill:#7c8aa0}
      .label{font:600 14px "Microsoft YaHei",Arial,sans-serif;fill:#34506f}
      .panel{fill:#ffffff;stroke:#d7e0ed;stroke-width:1}
      .subpanel{fill:#f8fafd;stroke:#dce5f0;stroke-width:1}

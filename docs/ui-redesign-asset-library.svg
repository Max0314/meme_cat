      <rect x="582" width="180" height="192" rx="12" class="subpanel"/>
      <rect x="596" y="14" width="152" height="106" rx="10" fill="url(#checker2)"/>
      <ellipse cx="672" cy="68" rx="48" ry="34" fill="#c1845d"/>

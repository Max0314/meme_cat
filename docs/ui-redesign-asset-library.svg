<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edf3f8"/>
    </linearGradient>
    <pattern id="checker2" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#e8edf4"/>
      <rect width="11" height="11" fill="#f6f8fb"/>
      <rect x="11" y="11" width="11" height="11" fill="#f6f8fb"/>
    </pattern>
    <style>
      .title{font:700 28px "Microsoft YaHei",Arial,sans-serif;fill:#152238}

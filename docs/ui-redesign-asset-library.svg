  <rect width="1500" height="900" fill="url(#bg2)"/>
  <rect x="28" y="28" width="1444" height="844" rx="14" class="panel"/>
  <text x="58" y="74" class="title">素材库重构：大素材量下的快速定位</text>
  <text x="58" y="104" class="txt">分类、搜索、分页、悬停预览、收藏和当前帧投放保持在一个连续工作流里。</text>

  <rect x="58" y="134" width="210" height="708" rx="12" fill="#f5f8fc" stroke="#d7e0ed"/>

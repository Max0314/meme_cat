      <text x="16" y="174" class="small">视频 · 12s</text>
      <rect x="194" width="180" height="192" rx="12" class="subpanel"/>
      <rect x="208" y="14" width="152" height="106" rx="10" fill="url(#checker2)"/>
      <ellipse cx="284" cy="68" rx="45" ry="32" fill="#d2b48c"/>
